<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <title>🐍 街機風貪吃蛇</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap');
    body {
      background: #111;
      color: #39ff14;
      font-family: 'Share Tech Mono', 'Consolas', 'Courier New', monospace;
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      letter-spacing: 2px;
      user-select: none;
    }
    h1 {
      font-size: 2.5rem;
      margin-top: 40px;
      margin-bottom: 10px;
      color: #39ff14;
      text-shadow: 0 0 12px #39ff14, 0 0 32px #39ff14, 0 0 4px #fff;
      letter-spacing: 4px;
      font-family: 'Share Tech Mono', 'Consolas', 'Courier New', monospace;
    }
    p, #score {
      color: #39ff14;
      font-size: 1.2rem;
      text-shadow: 0 0 6px #39ff14;
    }
    canvas {
      background: #000;
      border: 6px solid #ffd700;
      box-shadow: 0 0 32px #ffd70088, 0 0 16px #39ff14;
      margin-bottom: 16px;
      margin-top: 10px;
      image-rendering: pixelated;
    }
    button {
      background: linear-gradient(90deg, #ffd700 0%, #b8860b 100%);
      color: #232526;
      font-family: 'Share Tech Mono', 'Consolas', 'Courier New', monospace;
      font-size: 1.1rem;
      font-weight: bold;
      border: 2px solid #ffd700;
      border-radius: 8px;
      margin: 10px 8px;
      padding: 10px 32px;
      letter-spacing: 2px;
      box-shadow: 0 0 8px #ffd70055;
      cursor: pointer;
      transition: background 0.2s, color 0.2s;
    }
    button:hover {
      background: #39ff14;
      color: #111;
      border-color: #39ff14;
      box-shadow: 0 0 16px #39ff14;
    }
    .arcade-border {
      border: 8px double #39ff14;
      box-shadow: 0 0 24px #39ff14, 0 0 8px #ffd700 inset;
      border-radius: 12px;
      display: inline-block;
      padding: 8px;
      margin-bottom: 24px;
    }
  </style>
</head>
<body>
  <h1>🐍 SNAKE ARCADE</h1>
  <p>使用鍵盤方向鍵 ↑ ↓ ← → 控制蛇的移動</p>
  <div class="arcade-border">
    <canvas id="game" width="400" height="400"></canvas>
  </div>
  <p id="score">分數：0</p>
  <button onclick="startGame()">開始遊戲</button>
  <button onclick="restartGame()">重啟遊戲</button>
  <br>
  <a href="f0.html">
    <button style="margin-top:16px;">回到首頁</button>
  </a>
  <script>
    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d');
    const gridSize = 20;
    const tileCount = canvas.width / gridSize;

    let snake, dx, dy, food, score;
    let isRunning = false;

    document.addEventListener("keydown", keyDown);

    function keyDown(e) {
      if (!isRunning) return;

      switch (e.key) {
        case "ArrowUp":
          if (dy === 0) { dx = 0; dy = -1; }
          break;
        case "ArrowDown":
          if (dy === 0) { dx = 0; dy = 1; }
          break;
        case "ArrowLeft":
          if (dx === 0) { dx = -1; dy = 0; }
          break;
        case "ArrowRight":
          if (dx === 0) { dx = 1; dy = 0; }
          break;
      }
    }

    function startGame() {
      if (isRunning) return;
      resetGame();
      isRunning = true;
      requestAnimationFrame(gameLoop);
    }

    function restartGame() {
      resetGame();
      isRunning = true;
      requestAnimationFrame(gameLoop);
    }

    function resetGame() {
      snake = [{ x: 10, y: 10 }];
      dx = 0; // 初始不移動
      dy = 0;
      score = 0;
      food = spawnFood();
      updateScore();
      draw();
    }

    function gameLoop() {
      if (!isRunning) return;

      setTimeout(() => {
        requestAnimationFrame(gameLoop);

        // 如果還沒開始移動，就暫停遊戲邏輯（直到玩家按方向鍵）
        if (dx === 0 && dy === 0) return;

        const head = { x: snake[0].x + dx, y: snake[0].y + dy };

        if (
          head.x < 0 || head.x >= tileCount ||
          head.y < 0 || head.y >= tileCount ||
          snake.some(s => s.x === head.x && s.y === head.y)
        ) {
          alert("💀 遊戲結束！你的分數是：" + score);
          isRunning = false;
          return;
        }

        snake.unshift(head);

        if (head.x === food.x && head.y === food.y) {
          score++;
          food = spawnFood();
          updateScore();
        } else {
          snake.pop();
        }

        draw();
      }, 100); // 控制速度
    }

    function spawnFood() {
      let newFood;
      do {
        newFood = {
          x: Math.floor(Math.random() * tileCount),
          y: Math.floor(Math.random() * tileCount)
        };
      } while (snake.some(s => s.x === newFood.x && s.y === newFood.y));
      return newFood;
    }

    function updateScore() {
      document.getElementById("score").textContent = "分數：" + score;
    }

    function draw() {
      ctx.fillStyle = "black";
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      ctx.fillStyle = "lime";
      for (let s of snake) {
        ctx.fillRect(s.x * gridSize, s.y * gridSize, gridSize - 1, gridSize - 1);
      }

      ctx.fillStyle = "red";
      ctx.fillRect(food.x * gridSize, food.y * gridSize, gridSize - 1, gridSize - 1);
    }
  </script>
</body>
</html>
